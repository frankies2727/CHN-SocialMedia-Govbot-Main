name: govbot-bluesky-weekly-digest

on:
  # FRIDAY, second slot (90 min after the X digest). Bluesky's audience skews
  # news/policy and is most active during US working hours, so it pairs with X
  # on Friday rather than with the weekend visual feeds. The 90-minute gap keeps
  # two full 50-state clones off the runner pool at the same moment.
  #
  # NOTE the lead time: cron fires the *workflow*, not the post. The prepare job
  # clones first, so posts land roughly 45-70 minutes later — 14:37 UTC posts at
  # ~15:30-15:50 UTC ≈ 11:30-11:50 AM ET. This digest also fans out over five
  # shards, so the last topic lands later than the first.
  #
  # GitHub cron is fixed UTC and ignores DST, so during EST this lands an hour
  # earlier local. Odd minute dodges top-of-hour scheduler congestion.
  schedule:
    - cron: "37 14 * * FRI"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: govbot-bluesky-weekly-digest
  cancel-in-progress: false

# All topics run from the same govbot fetch + Ollama install. Adding a
# topic means dropping a topics/<name>/config.yml and adding the
# matching BLUESKY_HANDLE_<NAME> / BLUESKY_APP_PASSWORD_<NAME> repo secrets.

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Shared setup, run ONCE. The govbot national clone + bills.jsonl dump is the
  # slow, disk-heavy half of the pipeline and is identical for every shard, so
  # it used to run once PER shard — duplicated work that also had to fit in the
  # same 60-minute budget as the digests themselves. Do it once here, ship the
  # corpus as an artifact, and let the digest shards download it instead of each
  # re-cloning the country. Mirrors post_to_bluesky.yml.
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    # The digests always clone fresh (shared-cache is off, see below), so this
    # job pays the full national clone every week. 120 min gives it ample room.
    timeout-minutes: 120
    steps:
      - name: Free disk space
        # ubuntu-latest ships with ~14 GB free; the govbot clone across 50+
        # states blows past that ("No space left on device"). Strip out
        # preinstalled tooling we never use before cloning.
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install govbot, fetch all supported states, dump JSONL
        # Resilient install (retries the daily-republished upstream nightly).
        # shared-cache is OFF: all four weekly digests run Friday with the same
        # inputs, so with it on only the first would clone and the rest would
        # reuse that dump and SKIP the clone — leaving no on-disk metadata or
        # files/ dir for the staging step below to harvest. Cloning fresh keeps
        # govbot's committed full text on disk so digest summaries stay grounded.
        uses: ./.github/actions/govbot-bills
        with:
          shared-cache: "false"
          # Full-action feed — same as the daily posters. Dump EVERY action, not
          # just govbot's noteworthy ones, so a bill active only procedurally in
          # the lookback window still reaches the digest. since-days (45) sits
          # above the widest fallback window (30d) and, paired with --limit none,
          # keeps the larger feed bounded and free of arbitrary per-state
          # truncation. The digest's own topic match + 7/14/30d windows still
          # rank highlights.
          log-filter: "none"
          log-limit: "none"
          since-days: "45"

      - name: Stage the full-text bundle
        # govbot-bills only stages this itself when shared-cache is on, and the
        # digests keep it off — so do it explicitly here. Copies each in-window
        # bill's metadata.json + govbot's pre-extracted text out of the clone
        # into one small tarball, which is what lets the shards render grounded
        # summaries without re-cloning. stage_bill_text.py stages across every
        # topic and 45 days back, covering the digests' 30-day lookback; it needs
        # a BOT_TOPIC only to import the shared modules, so any topic will do.
        # Non-fatal: an empty bundle just means summaries fall back to abstracts.
        run: |
          FIRST_TOPIC=""
          for d in topics/*/; do
            [ -f "$d/config.yml" ] && FIRST_TOPIC=$(basename "$d") && break
          done
          if BOT_TOPIC="$FIRST_TOPIC" python scripts/stage_bill_text.py shared_bill_text; then
            echo "staged full text for $(find shared_bill_text -name metadata.json | wc -l) bill(s)."
          else
            echo "::warning::full-text staging failed; shipping an empty bundle (abstracts only)."
            mkdir -p shared_bill_text
          fi
          tar -czf shared_bill_text.tar.gz shared_bill_text

      - name: Upload the shared bill corpus
        uses: actions/upload-artifact@v4
        with:
          name: bills-corpus
          # bills.jsonl is the distilled national feed; shared_bill_text.tar.gz
          # carries the per-bill metadata + pre-extracted full text so the shards
          # can render full-text summaries without re-cloning.
          path: |
            bills.jsonl
            shared_bill_text.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  # ---------------------------------------------------------------------------
  # Build and post. Five shards run in parallel, each handling ~a fifth of the
  # topics. They download the shared corpus (no re-clone) and only install
  # Ollama locally (each runner needs its own model server; cache-backed).
  # ---------------------------------------------------------------------------
  digest:
    needs: prepare
    runs-on: ubuntu-latest
    # No govbot clone here (the corpus is downloaded), so a shard is just Ollama
    # setup (~2 min) + the digests themselves. Each digest runs several LLM
    # summaries per topic on the free runner's CPU model, which is what pushed
    # the old 2-shard, self-cloning job against its 60-minute budget. 120 min
    # plus a fifth of the topics per shard leaves generous headroom.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    env:
      LLM_MODEL: "gemma3:4b"
      # Wall-clock budget for the script itself, under the 120-minute job cap
      # above. Per-call LLM ceilings are 27 min, so without this one stuck bill
      # could spend 108+ min and get the job CANCELLED — which skips the commit
      # step. With it, the run clamps each call to the time left and finishes
      # early with fewer LLM-written posts instead of being killed.
      RUN_DEADLINE_MINUTES: "95"
    steps:
      - name: Free disk space
        # The Ollama LLM (~3.3 GB) plus the bill corpus in RAM need the
        # headroom; strip preinstalled tooling we never use.
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false  # keep swap: the LLM + full bill corpus need the RAM headroom

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install poppler-utils (pdftotext)
        # pdftotext extracts full bill text from a bill's PDF when the staged
        # bundle has metadata but no pre-extracted text. scripts/bill_text.py
        # caches results in .bill_text_cache/.
        # Bounded and retried. On govbot-bluesky-post #93 two of five shards hung
        # here for 102 minutes — a step that takes 6-13s on a healthy runner —
        # until the 120-minute job cap killed them, losing both shards' posts.
        # apt has no timeout of its own, so a slow mirror or a held dpkg lock
        # stalls indefinitely; the script's own RUN_DEADLINE_MINUTES cannot help
        # because Python never starts. timeout-minutes bounds the step, and
        # `timeout` bounds each apt call so a retry can actually happen.
        timeout-minutes: 6
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 90 apt-get update -qq \
               && sudo timeout 90 apt-get install -y -qq poppler-utils; then
              echo "poppler-utils ready (attempt $attempt)."
              exit 0
            fi
            echo "apt attempt $attempt failed or timed out; retrying..."
            sleep $(( attempt * 5 ))
          done
          # Non-fatal: bill_text falls back to the staged pre-extracted text and
          # then to abstracts. A thinner post beats a two-hour hang.
          echo "::warning::poppler-utils unavailable; PDF text extraction will fall back to abstracts."

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Download the shared bill corpus
        # Lands bills.jsonl (+ shared_bill_text.tar.gz) in the repo root, exactly
        # where the scripts expect them — no govbot clone needed in this job.
        uses: actions/download-artifact@v4
        with:
          name: bills-corpus
          path: .

      - name: Confirm corpus present and unpack staged bill text
        # Unpack the per-bill metadata + pre-extracted full text staged by the
        # prepare job. The digest step below sets GOVBOT_DATA_ROOT to this dir so
        # bill_text.resolve_metadata_path finds the staged subset exactly as it
        # would a full clone. A missing/empty tarball is non-fatal: the digests
        # just fall back to abstracts.
        run: |
          test -f bills.jsonl && echo "bills.jsonl: $(wc -l < bills.jsonl) lines" \
            || (echo "::error::bills.jsonl missing after download" && exit 1)
          if [ -f shared_bill_text.tar.gz ]; then
            tar -xzf shared_bill_text.tar.gz
            n=$(find shared_bill_text -name metadata.json 2>/dev/null | wc -l)
            echo "staged bill text: $n bill(s) with metadata unpacked."
          else
            echo "no staged bill text tarball; digests will use abstracts only."
          fi

      - name: Cache Ollama model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-${{ env.LLM_MODEL }}-v1

      - name: Cache Ollama binary
        # Bump the -v1 suffix to force a fresh install (e.g. to pick up a
        # new Ollama release).
        uses: actions/cache@v4
        with:
          path: ~/.ollama-bin
          key: ollama-bin-v1-linux-amd64

      - name: Cache extracted bill text
        # bill_text.py caches PDF-extracted text in .bill_text_cache/, keyed by
        # a hash of the document URL — content-addressed, so entries never go
        # stale. Persisting it across runs skips re-downloading and re-running
        # pdftotext for bills already processed on an earlier day (bills stay in
        # the freshness window for weeks). The run-scoped key always saves a
        # fresh, grown cache; restore-keys pulls the most recent prior one, and
        # the shared prefix lets every poster reuse text any other already
        # fetched. The shard suffix keeps the parallel shards from racing on
        # the same save key.
        uses: actions/cache@v4
        with:
          path: .bill_text_cache
          key: bill-text-cache-${{ github.run_id }}-${{ github.run_attempt }}-shard${{ matrix.shard }}
          restore-keys: |
            bill-text-cache-

      - name: Install Ollama and pull the LLM model
        run: |
          if [ -f "$HOME/.ollama-bin/usr-local.tar" ]; then
            echo "Restoring Ollama binary from cache."
            sudo tar -C / -xf "$HOME/.ollama-bin/usr-local.tar"
          else
            curl -fsSL https://ollama.com/install.sh | sh
            mkdir -p "$HOME/.ollama-bin"
            PATHS="usr/local/bin/ollama"
            [ -d /usr/local/lib/ollama ] && PATHS="$PATHS usr/local/lib/ollama"
            sudo tar -C / -cf "$HOME/.ollama-bin/usr-local.tar" $PATHS
            sudo chown -R "$USER:$USER" "$HOME/.ollama-bin"
          fi
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama is ready."
              break
            fi
            sleep 1
          done
          if ollama list | awk 'NR>1 {print $1}' | grep -qx "$LLM_MODEL"; then
            echo "$LLM_MODEL already present, skipping pull."
          else
            ollama pull "$LLM_MODEL"
          fi
          ollama list
          # Smoke-test the model, but DON'T pin it in memory (keep_alive:0
          # unloads it right after). Holding the 3.3GB model resident while the
          # next step loads the full bill corpus into RAM pushed the 16GB runner
          # over its memory limit, freezing the VM until GitHub killed the job
          # mid-step ("runner has received a shutdown signal"). The first real
          # summary reloads the model on demand.
          curl -fsS http://localhost:11434/api/generate \
            -d "{\"model\":\"$LLM_MODEL\",\"prompt\":\"ok\",\"stream\":false,\"keep_alive\":\"0\"}" \
            > /dev/null 2>&1 || echo "  (warm-up failed; model will load on first summary)"

      - name: Build and post weekly digest thread (all topics)
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          LLM_API_URL: "http://localhost:11434/api/chat"
          DIGEST_LOOKBACK_DAYS: "7"
          DIGEST_MAX_HIGHLIGHTS: "6"
          DIGEST_PER_STATE_CAP: "2"
          # Point bill_text.resolve_metadata_path at the staged subset the
          # prepare job shipped (metadata.json + pre-extracted full text), so
          # full bill text is used again even though the shard never cloned.
          GOVBOT_DATA_ROOT: "${{ github.workspace }}/shared_bill_text"
        run: |
          shopt -s nullglob
          # Assign topics to this shard by their sorted position (topics/*/
          # globs alphabetically). index % NUM_SHARDS interleaves them into a
          # balanced split that auto-rebalances when topics are added.
          SHARD="${{ matrix.shard }}"
          NUM_SHARDS=5
          i=0
          for topic_dir in topics/*/; do
            topic=$(basename "$topic_dir")
            [ -f "$topic_dir/config.yml" ] || continue
            if [ $(( i % NUM_SHARDS )) -ne "$SHARD" ]; then
              i=$(( i + 1 )); continue
            fi
            i=$(( i + 1 ))
            echo "=== Digest for topic: $topic (shard $SHARD/$NUM_SHARDS) ==="
            BOT_TOPIC="$topic" python scripts/weekly_digest_bluesky.py \
              || echo "  $topic digest failed, continuing with next topic"
          done
