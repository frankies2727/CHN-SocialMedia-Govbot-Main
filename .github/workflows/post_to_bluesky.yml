name: govbot-bluesky-post

on:
  schedule:
    # 3x a week on Mon/Wed/Fri (cron days 1,3,5) at 13:12 UTC ≈ 9:12 AM ET,
    # catching Bluesky's news/policy audience in the morning news cycle. GitHub
    # cron is fixed UTC and ignores DST, so during EST this lands an hour earlier
    # local. Odd minute (:12) dodges the top-of-hour scheduler congestion.
    - cron: "12 13 * * 1,3"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: govbot-bluesky-post
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Shared setup, run ONCE. The govbot national clone + bills.jsonl dump is the
  # slow (~20 min) half of the pipeline and is identical for every shard, so it
  # ran five times before (once per parallel shard) — ~100 min of duplicated
  # work that also pushed shards past the 60-minute job budget once the LLM
  # relevance gate made posting slower. Do it once here, publish bills.jsonl
  # (and the topic-independent normalized parse) as an artifact, and let the
  # post shards download it instead of each re-cloning the country.
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    # The first-of-day cache-miss run pays the full national clone (~24 min) plus
    # the `govbot logs` dump; a slow clone or a growing corpus pushed the old
    # 45-min budget over and cancelled the job mid-dump (govbot-bluesky-post #89).
    # 120 min gives that one cache-miss run per day ample headroom — same-day
    # re-runs hit the shared cache and finish in minutes.
    timeout-minutes: 120
    steps:
      - name: Free disk space
        # The govbot clone across 50+ states blows past the runner's ~14 GB free,
        # so reclaim space before cloning.
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install govbot, fetch all supported states, dump JSONL
        # Resilient install (retries the daily-republished upstream nightly) plus
        # a per-day shared bills.jsonl cache, so a same-day re-run skips the clone.
        uses: ./.github/actions/govbot-bills
        with:
          # Full-action feed: dump EVERY action (not just govbot's noteworthy
          # ones) so a bill whose only recent activity is procedural — an
          # introduction, a committee referral — still reaches the posters and
          # counts as fresh, instead of being invisible until it hits a floor
          # vote. since-days keeps that larger feed bounded (and --limit none
          # avoids arbitrary per-state truncation). Each topic's own keyword +
          # 32-day freshness gates still decide what actually posts.
          log-filter: "none"
          log-limit: "none"
          since-days: "45"

      - name: Build the normalized bill list (topic-independent, once)
        # Parsing bills.jsonl + running extract_fields is topic-independent, so do
        # it once here and ship the result — every shard's every topic reuses it
        # instead of re-parsing the whole corpus. Importing the module needs a
        # BOT_TOPIC, so pass the first available topic. Non-fatal: if it fails the
        # post shards fall back to parsing bills.jsonl directly.
        run: |
          FIRST_TOPIC=""
          for d in topics/*/; do
            [ -f "$d/config.yml" ] && FIRST_TOPIC=$(basename "$d") && break
          done
          BOT_TOPIC="$FIRST_TOPIC" python scripts/post_to_bluesky.py \
            --build-normalized bills_normalized.json \
            || echo "  normalized build failed; shards will parse bills.jsonl directly."

      # The full-text bundle (shared_bill_text.tar.gz) is produced by the
      # govbot-bills action above — staged from the fresh clone on a cache miss,
      # or restored from the shared per-day cache on a hit — so there's no
      # separate staging step here; we just ship whatever it produced.

      - name: Ensure the full-text bundle exists
        # Belt-and-suspenders: if staging was skipped for any reason, ship an
        # empty tarball so the upload path is always satisfied and the shards'
        # download/extract steps stay uniform (they fall back to abstracts).
        run: |
          [ -f shared_bill_text.tar.gz ] || { mkdir -p shared_bill_text; tar -czf shared_bill_text.tar.gz shared_bill_text; }

      - name: Upload the shared bill corpus
        uses: actions/upload-artifact@v4
        with:
          name: bills-corpus
          # bills_normalized.json may be absent if the build above failed; the
          # shards handle that by rebuilding from bills.jsonl. shared_bill_text
          # .tar.gz carries the per-bill metadata + pre-extracted full text.
          path: |
            bills.jsonl
            bills_normalized.json
            shared_bill_text.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  # ---------------------------------------------------------------------------
  # Post. Five shards run in parallel, each posting ~a fifth of the topics. They
  # download the shared corpus (no re-clone) and only install Ollama locally
  # (each runner needs its own model server; cache-backed, ~1-2 min).
  # ---------------------------------------------------------------------------
  post:
    needs: prepare
    runs-on: ubuntu-latest
    # No govbot clone here (the corpus is downloaded), so a shard is just Ollama
    # setup (~2 min) + posting. Posting has spiked to ~35 min; keep generous
    # headroom now that the LLM relevance gate adds a call per selected bill.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    env:
      LLM_MODEL: "gemma3:4b"
    steps:
      - name: Free disk space
        # The Ollama LLM (~3.3 GB) plus the full bill corpus in RAM need the
        # headroom; strip preinstalled tooling we never use.
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false  # keep swap: the LLM + full bill corpus need the RAM headroom

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install poppler-utils (pdftotext)
        # pdftotext extracts full bill text from each bill's PDF when the
        # govbot clone isn't present (the shards don't clone — they download the
        # corpus). scripts/bill_text.py caches results in .bill_text_cache/.
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Verify script exists
        run: |
          ls -la scripts/
          test -f scripts/post_to_bluesky.py && echo "OK" || (echo "MISSING" && exit 1)

      - name: Download the shared bill corpus
        # Lands bills.jsonl (+ bills_normalized.json when present, plus
        # shared_bill_text.tar.gz) in the repo root, exactly where the scripts
        # expect them — no govbot clone needed.
        uses: actions/download-artifact@v4
        with:
          name: bills-corpus
          path: .

      - name: Confirm corpus present and unpack staged bill text
        # Unpack the per-bill metadata + pre-extracted full text staged by the
        # prepare job. The posting step below sets GOVBOT_DATA_ROOT to this dir so
        # bill_text.resolve_metadata_path finds the staged subset exactly as it
        # would a full clone — restoring full bill text without re-cloning. A
        # missing/empty tarball is non-fatal: posts just fall back to abstracts.
        run: |
          test -f bills.jsonl && echo "bills.jsonl: $(wc -l < bills.jsonl) lines" \
            || (echo "::error::bills.jsonl missing after download" && exit 1)
          [ -f bills_normalized.json ] && echo "normalized parse present" \
            || echo "no normalized parse; will rebuild from bills.jsonl."
          if [ -f shared_bill_text.tar.gz ]; then
            tar -xzf shared_bill_text.tar.gz
            n=$(find shared_bill_text -name metadata.json 2>/dev/null | wc -l)
            echo "staged bill text: $n bill(s) with metadata unpacked."
          else
            echo "no staged bill text tarball; posts will use abstracts only."
          fi

      - name: Cache Ollama model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-${{ env.LLM_MODEL }}-v1

      - name: Cache Ollama binary
        # Bump the -v1 suffix to force a fresh install (e.g. to pick up a
        # new Ollama release).
        uses: actions/cache@v4
        with:
          path: ~/.ollama-bin
          key: ollama-bin-v1-linux-amd64

      - name: Cache extracted bill text
        # bill_text.py caches PDF-extracted text in .bill_text_cache/, keyed by
        # a hash of the document URL — content-addressed, so entries never go
        # stale. Persisting it across runs skips re-downloading and re-running
        # pdftotext for bills already processed on an earlier day (bills stay in
        # the freshness window for weeks). The run-scoped key always saves a
        # fresh, grown cache; restore-keys pulls the most recent prior one, and
        # the shared prefix lets every poster reuse text any other already
        # fetched. The shard suffix keeps the parallel shards from racing on
        # the same save key.
        uses: actions/cache@v4
        with:
          path: .bill_text_cache
          key: bill-text-cache-${{ github.run_id }}-${{ github.run_attempt }}-shard${{ matrix.shard }}
          restore-keys: |
            bill-text-cache-

      - name: Install Ollama and pull the LLM model
        run: |
          if [ -f "$HOME/.ollama-bin/usr-local.tar" ]; then
            echo "Restoring Ollama binary from cache."
            sudo tar -C / -xf "$HOME/.ollama-bin/usr-local.tar"
          else
            curl -fsSL https://ollama.com/install.sh | sh
            mkdir -p "$HOME/.ollama-bin"
            # Snapshot binary + libs so the next run skips the ~600 MB download.
            PATHS="usr/local/bin/ollama"
            [ -d /usr/local/lib/ollama ] && PATHS="$PATHS usr/local/lib/ollama"
            sudo tar -C / -cf "$HOME/.ollama-bin/usr-local.tar" $PATHS
            sudo chown -R "$USER:$USER" "$HOME/.ollama-bin"
          fi
          # Start Ollama in the background; logs to /tmp for debugging.
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          # Wait for the server to come up.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama is ready."
              break
            fi
            sleep 1
          done
          # Skip the pull entirely if the model is already on disk (cache hit);
          # otherwise do the full ~3.3 GB download.
          if ollama list | awk 'NR>1 {print $1}' | grep -qx "$LLM_MODEL"; then
            echo "$LLM_MODEL already present, skipping pull."
          else
            ollama pull "$LLM_MODEL"
          fi
          ollama list
          # Smoke-test the model, but DON'T pin it in memory (keep_alive:0
          # unloads it right after). Holding the 3.3GB model resident while the
          # next step loads the full bill corpus into RAM pushed the 16GB runner
          # over its memory limit, freezing the VM until GitHub killed the job
          # mid-step ("runner has received a shutdown signal"). The first real
          # summary reloads the model on demand.
          curl -fsS http://localhost:11434/api/generate \
            -d "{\"model\":\"$LLM_MODEL\",\"prompt\":\"ok\",\"stream\":false,\"keep_alive\":\"0\"}" \
            > /dev/null 2>&1 || echo "  (warm-up failed; model will load on first summary)"

      - name: Filter, summarize, and post to Bluesky (all topics)
        env:
          # toJSON(secrets) exposes the entire secret map so dropping in a new
          # topic never requires editing this workflow. The script reads
          # BLUESKY_HANDLE_<NAME> / BLUESKY_APP_PASSWORD_<NAME> from this map
          # at runtime based on BOT_TOPIC.
          ALL_SECRETS: ${{ toJSON(secrets) }}
          LLM_API_URL: "http://localhost:11434/api/chat"
          POST_LIMIT: "2"
          # Point bill_text.resolve_metadata_path at the staged subset the
          # prepare job shipped (metadata.json + pre-extracted full text), so
          # full bill text is used again even though the shard never cloned.
          GOVBOT_DATA_ROOT: "${{ github.workspace }}/shared_bill_text"
        run: |
          shopt -s nullglob
          # Point every per-topic process at the shared normalized parse built
          # once in the prepare job. If it wasn't produced (build failed), the
          # script rebuilds from bills.jsonl on first use.
          if [ -f bills_normalized.json ]; then
            export BILLS_NORMALIZED="$PWD/bills_normalized.json"
          fi

          # Assign topics to this shard by their sorted position (topics/*/
          # globs alphabetically). index % NUM_SHARDS interleaves them into a
          # balanced 3/3/3/2/2 split that auto-rebalances when topics are added.
          SHARD="${{ matrix.shard }}"
          NUM_SHARDS=5
          i=0
          for topic_dir in topics/*/; do
            topic=$(basename "$topic_dir")
            [ -f "$topic_dir/config.yml" ] || continue
            if [ $(( i % NUM_SHARDS )) -ne "$SHARD" ]; then
              i=$(( i + 1 )); continue
            fi
            i=$(( i + 1 ))
            echo "=== Posting for topic: $topic (shard $SHARD/$NUM_SHARDS) ==="
            BOT_TOPIC="$topic" python scripts/post_to_bluesky.py \
              || echo "  $topic post failed, continuing with next topic"
          done

      - name: Commit state changes
        run: |
          git config user.name  "govbot-bluesky[bot]"
          git config user.email "govbot-bluesky[bot]@users.noreply.github.com"
          git add topics/*/bluesky/bills_used.json topics/*/bluesky/bills_raw topics/*/bluesky/bills_full_text || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "chore: update posted state (shard ${{ matrix.shard }}) [skip ci]"
          # All five shards push to the same branch concurrently. They write
          # disjoint topics/<name>/ folders, so rebasing onto another shard's
          # commit is always clean; retry with backoff until the push lands.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              break
            fi
            echo "Push rejected (attempt $attempt); rebasing on latest and retrying."
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            sleep $(( attempt * 2 ))
          done
