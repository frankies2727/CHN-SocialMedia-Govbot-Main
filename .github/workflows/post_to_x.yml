name: govbot-x-post-ai-data-centers-including-crypto

on:
  schedule:
    # 3x a week on Tue/Thu/Sat (cron days 2,4,6) at 12:27 UTC ≈ 8:27 AM ET,
    # catching X's real-time news/politics audience in the early-morning feed.
    # GitHub cron is fixed UTC and ignores DST, so during EST this lands an hour
    # earlier local. Odd minute (:27) dodges the top-of-hour scheduler congestion.
    - cron: "27 12 * * 2,4,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: govbot-x-post
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Shared setup, run ONCE on its own runner. The govbot national clone across
  # 50+ states is the disk- and time-heavy half of the pipeline. Doing it here,
  # distilling it to a compact bills.jsonl (+ staged full-text bundle), and
  # shipping that as an artifact means the post job never has to hold the giant
  # clone AND the Ollama model on disk at the same time — the combination that
  # crashed the old single-job workflow with "No space left on device".
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    # A first-of-day cache-miss run pays the full national clone (~24 min) plus
    # the `govbot logs` dump; 120 min gives that run ample headroom, while
    # same-day re-runs hit the shared cache and finish in minutes.
    timeout-minutes: 120
    steps:
      - name: Free disk space
        # The govbot clone across 50+ states blows past the runner's ~14 GB free,
        # so reclaim space before cloning. tool-cache + large-packages are the
        # biggest reclaimable items; Python is reinstalled by setup-python below.
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install govbot, fetch all supported states, dump JSONL
        # Resilient install (retries the daily-republished upstream nightly) plus
        # a per-day shared bills.jsonl cache, so a same-day re-run skips the clone.
        uses: ./.github/actions/govbot-bills
        with:
          # Full-action feed: dump EVERY action (not just govbot's noteworthy
          # ones) so a bill whose only recent activity is procedural — an
          # introduction, a committee referral — still reaches the poster and
          # counts as fresh, instead of being invisible until it hits a floor
          # vote. since-days keeps that larger feed bounded (and --limit none
          # avoids arbitrary per-state truncation). The script's own topic +
          # 32-day freshness gates still decide what actually posts.
          log-filter: "none"
          log-limit: "none"
          since-days: "45"

      - name: Ensure the full-text bundle exists
        # The govbot-bills action stages shared_bill_text.tar.gz from the fresh
        # clone (or restores it from the per-day cache). Belt-and-suspenders: if
        # staging was skipped for any reason, ship an empty tarball so the upload
        # path is always satisfied and the post job's download/extract stays
        # uniform (it falls back to abstracts when the bundle is empty).
        run: |
          [ -f shared_bill_text.tar.gz ] || { mkdir -p shared_bill_text; tar -czf shared_bill_text.tar.gz shared_bill_text; }

      - name: Upload the shared bill corpus
        uses: actions/upload-artifact@v4
        with:
          name: bills-corpus
          # bills.jsonl is the distilled national feed; shared_bill_text.tar.gz
          # carries the per-bill metadata + pre-extracted full text so the post
          # job can render full-text summaries without re-cloning.
          path: |
            bills.jsonl
            shared_bill_text.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  # ---------------------------------------------------------------------------
  # Post. Downloads the shared corpus (no re-clone) and only installs Ollama
  # locally (its own model server; cache-backed, ~1-2 min), so this runner holds
  # the compact corpus + the model — never the full clone — keeping it well
  # under the disk limit.
  # ---------------------------------------------------------------------------
  post:
    needs: prepare
    runs-on: ubuntu-latest
    # No govbot clone here (the corpus is downloaded), so this is just Ollama
    # setup (~2 min) + posting. The posting script enforces its own 40-minute
    # budget (POST_DEADLINE_MINUTES) and exits cleanly when it's spent, so this
    # job cap is a backstop rather than the thing that ends a slow run — which
    # is what it had become: a cancel here skips the state commit below.
    timeout-minutes: 60
    env:
      LLM_MODEL: "gemma3:4b"
      BOT_TOPIC: "ai_data_centers"
      POST_LIMIT: "3"
      DRY_RUN: "0"
    steps:
      - name: Free disk space
        # The Ollama LLM (~3.3 GB) plus the full bill corpus in RAM need the
        # headroom; strip preinstalled tooling we never use.
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false  # keep swap: the LLM + full bill corpus need the RAM headroom

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install poppler-utils (pdftotext)
        # Lets scripts/bill_text.py extract full bill text from PDFs for the
        # X summaries; degrades gracefully to abstract-only if absent.
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Verify script exists
        run: |
          ls -la scripts/
          test -f scripts/post_to_x.py && echo "OK" || (echo "MISSING" && exit 1)

      - name: Download the shared bill corpus
        # Lands bills.jsonl (+ shared_bill_text.tar.gz) in the repo root, exactly
        # where the scripts expect them — no govbot clone needed.
        uses: actions/download-artifact@v4
        with:
          name: bills-corpus
          path: .

      - name: Confirm corpus present and unpack staged bill text
        # Unpack the per-bill metadata + pre-extracted full text staged by the
        # prepare job. The posting step below sets GOVBOT_DATA_ROOT to this dir so
        # bill_text.resolve_metadata_path finds the staged subset exactly as it
        # would a full clone — restoring full bill text without re-cloning. A
        # missing/empty tarball is non-fatal: posts just fall back to abstracts.
        run: |
          test -f bills.jsonl && echo "bills.jsonl: $(wc -l < bills.jsonl) lines" \
            || (echo "::error::bills.jsonl missing after download" && exit 1)
          if [ -f shared_bill_text.tar.gz ]; then
            tar -xzf shared_bill_text.tar.gz
            n=$(find shared_bill_text -name metadata.json 2>/dev/null | wc -l)
            echo "staged bill text: $n bill(s) with metadata unpacked."
          else
            echo "no staged bill text tarball; posts will use abstracts only."
          fi

      - name: Cache Ollama model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-${{ env.LLM_MODEL }}-v1

      - name: Cache Ollama binary
        # Bump the -v1 suffix to force a fresh install (e.g. to pick up a
        # new Ollama release).
        uses: actions/cache@v4
        with:
          path: ~/.ollama-bin
          key: ollama-bin-v1-linux-amd64

      - name: Cache extracted bill text
        # bill_text.py caches PDF-extracted text in .bill_text_cache/, keyed by
        # a hash of the document URL — content-addressed, so entries never go
        # stale. Persisting it across runs skips re-downloading and re-running
        # pdftotext for bills already processed on an earlier day (bills stay in
        # the freshness window for weeks). The run-scoped key always saves a
        # fresh, grown cache; restore-keys pulls the most recent prior one, and
        # the shared prefix lets every poster reuse text any other already
        # fetched.
        uses: actions/cache@v4
        with:
          path: .bill_text_cache
          key: bill-text-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bill-text-cache-

      - name: Install Ollama and pull the LLM model
        run: |
          if [ -f "$HOME/.ollama-bin/usr-local.tar" ]; then
            echo "Restoring Ollama binary from cache."
            sudo tar -C / -xf "$HOME/.ollama-bin/usr-local.tar"
          else
            curl -fsSL https://ollama.com/install.sh | sh
            mkdir -p "$HOME/.ollama-bin"
            PATHS="usr/local/bin/ollama"
            [ -d /usr/local/lib/ollama ] && PATHS="$PATHS usr/local/lib/ollama"
            sudo tar -C / -cf "$HOME/.ollama-bin/usr-local.tar" $PATHS
            sudo chown -R "$USER:$USER" "$HOME/.ollama-bin"
          fi
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama is ready."
              break
            fi
            sleep 1
          done
          if ollama list | awk 'NR>1 {print $1}' | grep -qx "$LLM_MODEL"; then
            echo "$LLM_MODEL already present, skipping pull."
          else
            ollama pull "$LLM_MODEL"
          fi
          ollama list
          # Smoke-test the model, but DON'T pin it in memory (keep_alive:0
          # unloads it right after). Holding the 3.3GB model resident while the
          # next step loads the full bill corpus into RAM pushed the 16GB runner
          # over its memory limit, freezing the VM until GitHub killed the job
          # mid-step ("runner has received a shutdown signal"). The first real
          # summary reloads the model on demand.
          curl -fsS http://localhost:11434/api/generate \
            -d "{\"model\":\"$LLM_MODEL\",\"prompt\":\"ok\",\"stream\":false,\"keep_alive\":\"0\"}" \
            > /dev/null 2>&1 || echo "  (warm-up failed; model will load on first summary)"

      - name: Post to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          LLM_API_URL: "http://localhost:11434/api/chat"
          # Point bill_text.resolve_metadata_path at the staged subset the
          # prepare job shipped (metadata.json + pre-extracted full text), so
          # full bill text is used again even though this job never cloned.
          GOVBOT_DATA_ROOT: "${{ github.workspace }}/shared_bill_text"
        run: python scripts/post_to_x.py

      - name: Commit X state changes
        # always(), so this runs even when the posting step failed or was
        # cancelled. Tweets go live one at a time and post_to_x.py checkpoints
        # its state file after each one, so a run that dies partway still has
        # real posts to record. Skipping the commit there is what turns a
        # timeout into duplicate tweets on the next run.
        if: ${{ always() && env.DRY_RUN != '1' }}
        run: |
          git config user.name  "govbot-x[bot]"
          git config user.email "govbot-x[bot]@users.noreply.github.com"
          git add topics/*/x*/bills_used.json topics/*/x*/bills_raw topics/*/x*/bills_full_text || true
          if git diff --cached --quiet; then
            echo "No X state changes to commit."
          else
            git commit -m "chore: update X posted state [skip ci]"
            git push
          fi
