name: govbot-meta-threads-post

on:
  schedule:
    # 3x a week on Tue/Thu/Sun (cron days 2,4,0) at 23:12 UTC ≈ 7:12 PM ET,
    # catching Threads' Meta audience in the evening wind-down scroll. The third
    # run moved off Saturday so it no longer shares a day with the Saturday
    # Threads digest, and Sunday evening is a stronger slot for this feed than
    # Saturday evening.
    #
    # GitHub cron is fixed UTC and ignores DST, so during EST this lands an hour
    # earlier local. Odd minute (:12) dodges the top-of-hour scheduler congestion.
    - cron: "12 23 * * 2,4,0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: govbot-meta-threads-post
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Fetch, run ONCE. The govbot national clone + bills.jsonl dump is the slow
  # (~45 min) half of the pipeline. When it shared a single 60-minute job with
  # posting, a slow clone left too little time and the runner was cancelled
  # mid-post. Splitting the fetch into its own job means posting always starts
  # with a fresh 55-minute budget. This job clones fresh, dumps bills.jsonl,
  # builds the topic-independent normalized parse, stages the full-text bundle,
  # and ships all three to the post job as an artifact.
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    # The first-of-day cache-miss run pays the full national clone (~24 min) plus
    # the `govbot logs` dump; a slow clone or a growing corpus pushed the old
    # 45-min budget over and cancelled the job mid-dump (govbot-bluesky-post #89).
    # 120 min gives that one cache-miss run per day ample headroom — same-day
    # re-runs hit the shared cache and finish in minutes.
    timeout-minutes: 120
    steps:
      - name: Free disk space
        # ubuntu-latest ships with ~14 GB free; the govbot clone across 50+
        # states blows past that ("No space left on device"). Strip preinstalled
        # tooling we never use to recover ~30 GB before cloning.
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python deps
        # Needed before the govbot-bills staging step and the normalized build,
        # both of which import the repo's scripts (requests, PyYAML, Pillow, …).
        run: pip install -r requirements.txt

      - name: Install govbot, fetch all supported states, dump JSONL
        # Resilient install (retries the daily-republished upstream nightly).
        # shared-cache is OFF on purpose: Threads runs after X on the same days
        # (Tue/Thu/Sat), so with the shared cache on it would reuse X's
        # bills.jsonl and SKIP the clone — leaving no on-disk metadata or files/
        # dir. Cloning fresh keeps govbot's committed full text
        # (bills/{id}/files/{id}_text_extracted.txt) on disk so summaries stay
        # grounded in the real legislation. Because the clone lives only on this
        # job's runner, the staging step below copies the small full-text subset
        # into a bundle the post job can use without re-cloning. See
        # .github/actions/govbot-bills.
        uses: ./.github/actions/govbot-bills
        with:
          shared-cache: "false"
          # Full-action feed: dump EVERY action (not just govbot's noteworthy
          # ones) so a bill whose only recent activity is procedural — an
          # introduction, a committee referral — still reaches the posters and
          # counts as fresh, instead of being invisible until it hits a floor
          # vote. since-days keeps that larger feed bounded (and --limit none
          # avoids arbitrary per-state truncation). Each topic's own keyword +
          # 32-day freshness gates still decide what actually posts.
          log-filter: "none"
          log-limit: "none"
          since-days: "45"

      - name: Build the normalized bill list (topic-independent, once)
        # Parsing bills.jsonl + running extract_fields is topic-independent, so do
        # it once here and ship the result — every topic in the post job reuses it
        # instead of re-parsing the whole corpus. Importing the module needs a
        # BOT_TOPIC, so pass the first available topic. Non-fatal: if it fails the
        # post job falls back to parsing bills.jsonl directly.
        run: |
          FIRST_TOPIC=""
          for d in topics/*/; do
            [ -f "$d/config.yml" ] && FIRST_TOPIC=$(basename "$d") && break
          done
          BOT_TOPIC="$FIRST_TOPIC" python scripts/post_to_bluesky.py \
            --build-normalized bills_normalized.json \
            || echo "  normalized build failed; the post job will parse bills.jsonl directly."

      - name: Stage the full-text bundle from the fresh clone
        # The govbot-bills action only stages this bundle when shared-cache is on;
        # here shared-cache is off (we always re-clone fresh), so stage it
        # ourselves. stage_bill_text.py copies the small, useful subset — each
        # topic-matched, in-window bill's metadata.json + pre-extracted text —
        # out of the on-disk clone into shared_bill_text/, then we tar it so it
        # rides in the corpus artifact. The post job unpacks it and points
        # GOVBOT_DATA_ROOT at it, so full bill text survives even though that job
        # never clones. Reuse the normalized parse we just built. Non-fatal: on
        # any failure we still ship an (empty) tarball so the post job's
        # download/unpack path stays uniform and posts fall back to abstracts.
        run: |
          [ -f bills_normalized.json ] && export BILLS_NORMALIZED="$PWD/bills_normalized.json"
          FIRST_TOPIC=""
          for d in topics/*/; do
            [ -f "$d/config.yml" ] && FIRST_TOPIC=$(basename "$d") && break
          done
          if [ -n "$FIRST_TOPIC" ] && \
             BOT_TOPIC="$FIRST_TOPIC" python scripts/stage_bill_text.py shared_bill_text; then
            echo "Staged full-text bundle from the fresh clone."
          else
            echo "::warning::full-text staging failed or no topics; shipping empty bundle (abstracts only)."
            mkdir -p shared_bill_text
          fi
          tar -czf shared_bill_text.tar.gz shared_bill_text
          echo "shared_bill_text.tar.gz is $(du -h shared_bill_text.tar.gz | cut -f1)."

      - name: Ensure the full-text bundle exists
        # Belt-and-suspenders: if staging was skipped for any reason, ship an
        # empty tarball so the upload path is always satisfied and the post job's
        # download/extract stays uniform (it falls back to abstracts).
        run: |
          [ -f shared_bill_text.tar.gz ] || { mkdir -p shared_bill_text; tar -czf shared_bill_text.tar.gz shared_bill_text; }

      - name: Upload the shared bill corpus
        uses: actions/upload-artifact@v4
        with:
          name: bills-corpus
          # bills_normalized.json may be absent if the build above failed; the
          # post job handles that by rebuilding from bills.jsonl. shared_bill_text
          # .tar.gz carries the per-bill metadata + pre-extracted full text.
          path: |
            bills.jsonl
            bills_normalized.json
            shared_bill_text.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  # ---------------------------------------------------------------------------
  # Post. Runs after prepare with its own fresh 55-minute budget (no clone here
  # — it downloads the corpus artifact). The single Threads account spans every
  # topic, so this loops over all topics/ in one sequential run (not sharded —
  # one account, one writer to the shared account-level dedup ledger + per-run
  # cap). BOT_TOPIC is set per topic inside the post step.
  # ---------------------------------------------------------------------------
  post:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      LLM_MODEL: "gemma3:4b"
      # Wall-clock budget for the script itself, under the 120-minute job cap
      # above. Per-call LLM ceilings are 27 min, so without this one stuck bill
      # could spend 108+ min and get the job CANCELLED — which skips the commit
      # step. With it, the run clamps each call to the time left and finishes
      # early with fewer LLM-written posts instead of being killed.
      RUN_DEADLINE_MINUTES: "95"
      DRY_RUN: "0"
      # Shared by every per-topic process so the per-run cap spans the whole loop
      # yet starts fresh next run.
      RUN_ID: "${{ github.run_id }}-${{ github.run_attempt }}"

    steps:
      - name: Free disk space
        # The Ollama LLM (~3.3 GB) plus the full bill corpus in RAM need the
        # headroom; strip preinstalled tooling we never use.
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false  # keep swap: the LLM + full bill corpus need the RAM headroom

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install poppler-utils (pdftotext)
        # Lets scripts/bill_text.py extract full bill text from a bill's PDF when
        # the pre-extracted text isn't in the staged bundle; degrades gracefully
        # to abstract-only if absent.
        # Bounded and retried. On govbot-bluesky-post #93 two of five shards hung
        # here for 102 minutes — a step that takes 6-13s on a healthy runner —
        # until the 120-minute job cap killed them, losing both shards' posts.
        # apt has no timeout of its own, so a slow mirror or a held dpkg lock
        # stalls indefinitely; the script's own RUN_DEADLINE_MINUTES cannot help
        # because Python never starts. timeout-minutes bounds the step, and
        # `timeout` bounds each apt call so a retry can actually happen.
        timeout-minutes: 6
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 90 apt-get update -qq \
               && sudo timeout 90 apt-get install -y -qq poppler-utils; then
              echo "poppler-utils ready (attempt $attempt)."
              exit 0
            fi
            echo "apt attempt $attempt failed or timed out; retrying..."
            sleep $(( attempt * 5 ))
          done
          # Non-fatal: bill_text falls back to the staged pre-extracted text and
          # then to abstracts. A thinner post beats a two-hour hang.
          echo "::warning::poppler-utils unavailable; PDF text extraction will fall back to abstracts."

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Download the shared bill corpus
        # Lands bills.jsonl (+ bills_normalized.json when present, plus
        # shared_bill_text.tar.gz) in the repo root, exactly where the scripts
        # expect them — no govbot clone needed.
        uses: actions/download-artifact@v4
        with:
          name: bills-corpus
          path: .

      - name: Confirm corpus present and unpack staged bill text
        # Unpack the per-bill metadata + pre-extracted full text staged by the
        # prepare job. The posting step below sets GOVBOT_DATA_ROOT to this dir so
        # bill_text.resolve_metadata_path finds the staged subset exactly as it
        # would a full clone — restoring full bill text without re-cloning. A
        # missing/empty tarball is non-fatal: posts just fall back to abstracts.
        run: |
          test -f bills.jsonl && echo "bills.jsonl: $(wc -l < bills.jsonl) lines" \
            || (echo "::error::bills.jsonl missing after download" && exit 1)
          [ -f bills_normalized.json ] && echo "normalized parse present" \
            || echo "no normalized parse; will rebuild from bills.jsonl."
          if [ -f shared_bill_text.tar.gz ]; then
            tar -xzf shared_bill_text.tar.gz
            n=$(find shared_bill_text -name metadata.json 2>/dev/null | wc -l)
            echo "staged bill text: $n bill(s) with metadata unpacked."
          else
            echo "no staged bill text tarball; posts will use abstracts only."
          fi

      - name: Cache Ollama model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-${{ env.LLM_MODEL }}-v1

      - name: Cache Ollama binary
        # Bump the -v1 suffix to force a fresh install (e.g. to pick up a
        # new Ollama release).
        uses: actions/cache@v4
        with:
          path: ~/.ollama-bin
          key: ollama-bin-v1-linux-amd64

      - name: Cache extracted bill text
        # bill_text.py caches PDF-extracted text in .bill_text_cache/, keyed by
        # a hash of the document URL — content-addressed, so entries never go
        # stale. Persisting it across runs skips re-downloading and re-running
        # pdftotext for bills already processed on an earlier day (bills stay in
        # the freshness window for weeks). The run-scoped key always saves a
        # fresh, grown cache; restore-keys pulls the most recent prior one, and
        # the shared prefix lets every poster reuse text any other already
        # fetched.
        uses: actions/cache@v4
        with:
          path: .bill_text_cache
          key: bill-text-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bill-text-cache-

      - name: Install Ollama and pull the LLM model
        run: |
          if [ -f "$HOME/.ollama-bin/usr-local.tar" ]; then
            echo "Restoring Ollama binary from cache."
            sudo tar -C / -xf "$HOME/.ollama-bin/usr-local.tar"
          else
            curl -fsSL https://ollama.com/install.sh | sh
            mkdir -p "$HOME/.ollama-bin"
            PATHS="usr/local/bin/ollama"
            [ -d /usr/local/lib/ollama ] && PATHS="$PATHS usr/local/lib/ollama"
            sudo tar -C / -cf "$HOME/.ollama-bin/usr-local.tar" $PATHS
            sudo chown -R "$USER:$USER" "$HOME/.ollama-bin"
          fi
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama is ready."
              break
            fi
            sleep 1
          done
          if ollama list | awk 'NR>1 {print $1}' | grep -qx "$LLM_MODEL"; then
            echo "$LLM_MODEL already present, skipping pull."
          else
            ollama pull "$LLM_MODEL"
          fi
          ollama list
          # Smoke-test the model, but DON'T pin it in memory (keep_alive:0
          # unloads it right after). Holding the 3.3GB model resident while the
          # next step loads the full bill corpus into RAM pushed the 16GB runner
          # over its memory limit, freezing the VM until GitHub killed the job
          # mid-step ("runner has received a shutdown signal"). The first real
          # summary reloads the model on demand.
          curl -fsS http://localhost:11434/api/generate \
            -d "{\"model\":\"$LLM_MODEL\",\"prompt\":\"ok\",\"stream\":false,\"keep_alive\":\"0\"}" \
            > /dev/null 2>&1 || echo "  (warm-up failed; model will load on first summary)"

      - name: Post to Threads (all topics)
        # One account, every topic: walk the topics in randomized order so
        # coverage rotates fairly day to day. The account-level per-run cap
        # (RUN_POST_LIMIT) stops the loop once enough has gone out, and the
        # account ledger keeps a bill matched by two topics from posting twice.
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          LLM_API_URL: "http://localhost:11434/api/chat"
          # Per-topic cap kept at 1 so the per-run cap (3) spreads across several
          # different topics each run rather than being eaten by the first one.
          POST_LIMIT: "1"
          RUN_POST_LIMIT: "3"
          # Point bill_text.resolve_metadata_path at the staged subset the prepare
          # job shipped (metadata.json + pre-extracted full text), so full bill
          # text is used again even though this job never cloned.
          GOVBOT_DATA_ROOT: "${{ github.workspace }}/shared_bill_text"
        run: |
          shopt -s nullglob
          # Point every per-topic process at the shared normalized parse built
          # once in the prepare job. If it wasn't produced (build failed), the
          # script rebuilds from bills.jsonl on first use.
          if [ -f bills_normalized.json ]; then
            export BILLS_NORMALIZED="$PWD/bills_normalized.json"
          fi

          # Topic order: a deterministic march through the alphabetical topic
          # list that RESUMES where the previous run's posting actually stopped.
          # (See post_to_instagram.yml for the full rationale.) The old scheme
          # derived the start from the run counter (run_number * cap % n), which
          # assumed every run posted a full contiguous block of `cap` topics; a
          # skipped empty topic pushed the real block past `cap` positions and the
          # next run's fixed start overlapped the tail, re-posting a topic on
          # back-to-back runs. Persisting the topic just AFTER the last actual
          # post and resuming there removes the overlap.
          mapfile -t TOPICS < <(for d in topics/*/; do [ -f "$d/config.yml" ] && basename "$d"; done | sort)
          n=${#TOPICS[@]}
          if [ "$n" -eq 0 ]; then echo "No topics with config.yml found."; exit 0; fi
          ROTATION_FILE="account_state/meta-threads/rotation.txt"
          # Resume from the persisted topic NAME (robust to topics being added or
          # removed — indices shift, names don't). Before any pointer exists, seed
          # from the run counter so the first run still varies its start.
          start=$(( ${{ github.run_number }} % n ))
          if [ -f "$ROTATION_FILE" ]; then
            saved="$(tr -d '[:space:]' < "$ROTATION_FILE")"
            for idx in "${!TOPICS[@]}"; do
              if [ "${TOPICS[$idx]}" = "$saved" ]; then start=$idx; break; fi
            done
          fi
          echo "Topic rotation: $n topics, resuming at ${TOPICS[$start]} (index $start)."
          TOPIC_LOG="${RUNNER_TEMP:-/tmp}/govbot_topic_out.txt"
          # The per-topic process exits with code 42 (RUN_CAP_REACHED_EXIT) once
          # the account's per-run cap is full — either it was already full or
          # that topic's posts filled it. Break on it so the remaining topics
          # don't each boot Python and re-load the full corpus only to no-op.
          last_posted=-1
          for (( k=0; k<n; k++ )); do
            topic="${TOPICS[$(( (start + k) % n ))]}"
            echo "=== Threads: topic $topic ==="
            rc=0
            # tee keeps the live log while we scan the output for the post signal;
            # PIPESTATUS[0] is python's exit (pipefail-safe under the default -eo).
            BOT_TOPIC="$topic" python scripts/post_to_meta_threads.py 2>&1 | tee "$TOPIC_LOG" || rc="${PIPESTATUS[0]}"
            # A real post prints "Done. Posted <N>=1 update(s)"; advance the
            # pointer only past topics that genuinely posted.
            if grep -qE "Done\. Posted [1-9][0-9]* update" "$TOPIC_LOG"; then
              last_posted=$k
            fi
            if [ "$rc" -eq 42 ]; then
              echo "  account per-run cap reached — stopping the topic loop."
              break
            elif [ "$rc" -ne 0 ]; then
              echo "  $topic post failed, continuing with next topic"
            fi
          done
          # Persist the resume point: the topic just AFTER the last one that
          # posted. If nothing posted this run, step forward one so a barren
          # stretch can't wedge the pointer in place.
          if [ "$last_posted" -ge 0 ]; then
            next=$(( (start + last_posted + 1) % n ))
          else
            next=$(( (start + 1) % n ))
          fi
          mkdir -p "$(dirname "$ROTATION_FILE")"
          echo "${TOPICS[$next]}" > "$ROTATION_FILE"
          echo "Topic rotation: next run resumes at ${TOPICS[$next]} (index $next)."

      - name: Commit Threads state changes
        if: env.DRY_RUN != '1'
        run: |
          git config user.name  "govbot-meta-threads[bot]"
          git config user.email "govbot-meta-threads[bot]@users.noreply.github.com"
          git add topics/*/meta-threads/bills_used.json topics/*/meta-threads/bills_raw topics/*/meta-threads/bills_full_text account_state/meta-threads || true
          if git diff --cached --quiet; then
            echo "No Threads state changes to commit."
            exit 0
          fi
          git commit -m "chore: update Threads posted state [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              break
            fi
            echo "Push rejected (attempt $attempt); rebasing and retrying."
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            sleep $(( attempt * 2 ))
          done
