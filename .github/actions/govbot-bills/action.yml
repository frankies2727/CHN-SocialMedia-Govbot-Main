name: "govbot: fetch bills"
description: >
  Install the govbot CLI, clone the requested state repos, and dump the
  legislative log to bills.jsonl. The install is resilient to the upstream
  "nightly" release being briefly republished each day, and (by default) the
  resulting bills.jsonl is shared across every run on the same UTC day so only
  the first poster pays the full national clone.

inputs:
  clone-target:
    description: "What govbot clones: 'all' or a space-separated state list."
    required: false
    default: "all"
  log-limit:
    description: "Max records dumped by 'govbot logs --limit' ('none' for the full log)."
    required: false
    default: "55200"
  log-filter:
    description: >
      Value for 'govbot logs --filter'. Empty (the default) leaves govbot's
      built-in relevance filter on, matching the daily/digest pipelines. Set to
      'none' to disable it and dump every action (the scripts apply their own
      topic + freshness filters) — useful for narrow ad-hoc state pulls.
    required: false
    default: ""
  since-days:
    description: >
      When set to an integer N, date-bounds the dump to actions from the last N
      days: govbot streams the full log and records with an action date older
      than N days are dropped before bills.jsonl is written (undated records,
      which are rare, are kept so nothing is silently lost). This is what makes
      'log-filter: none' safe at 'clone all' scale — the full-action feed (every
      routine referral/reading, not just the noteworthy actions) would otherwise
      balloon bills.jsonl and, under a per-state --limit, arbitrarily truncate a
      high-volume state. Pair it with 'log-limit: none' so nothing is capped
      before the date bound is applied. Empty (the default) writes the dump
      unbounded, preserving historical pulls (collect-samples' from/to months,
      the digests). Keep N comfortably above the scripts' MAX_ACTION_AGE_DAYS.
    required: false
    default: ""
  shared-cache:
    description: >
      'true' shares one bills.jsonl across all runs on the same UTC day with the
      same clone-target + log-limit (skips the clone on a hit). Set 'false' for
      ad-hoc clones (e.g. specific states) that should not be reused.
    required: false
    default: "true"
  stage-text:
    description: >
      'true' also stages a small full-text bundle (each in-window, topic-matched
      bill's metadata.json + pre-extracted text) beside bills.jsonl, so full bill
      text survives the cache hit that skips the clone. On a cache hit the bundle
      is unpacked and GOVBOT_DATA_ROOT is exported for later steps. Requires the
      caller to have installed requirements.txt first. Non-fatal if it fails.
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Resolve shared bills cache key
      id: cachekey
      if: ${{ inputs.shared-cache == 'true' }}
      shell: bash
      run: |
        # One snapshot per UTC day, per clone-target + log-limit. Bills stay in
        # the freshness window for weeks, so every poster on a given day can
        # safely reuse the same dump instead of re-cloning 50+ repos each time.
        slug=$(printf '%s' "${{ inputs.clone-target }}" | tr -c 'A-Za-z0-9' '-')
        # The filter + since-days shape the CONTENTS of bills.jsonl, so they must
        # be part of the key: without them a filter=none run and a filter=default
        # run (same clone-target + limit) would collide and one would silently
        # serve the other's dump. tr keeps the key filesystem-safe ('none'->none,
        # ''->empty, '45'->45).
        fslug=$(printf '%s' "${{ inputs.log-filter }}-${{ inputs.since-days }}" | tr -c 'A-Za-z0-9' '-')
        # -v3 bump: key now carries fslug (filter + since-days). Invalidates v2
        # caches that keyed only on clone-target + limit, so a v2 filter=default
        # dump can't be handed to a new filter=none consumer.
        echo "key=bills-jsonl-v3-$(date -u +%F)-${slug}-${{ inputs.log-limit }}-${fslug}" >> "$GITHUB_OUTPUT"

    - name: Restore shared bills.jsonl + full-text bundle
      id: bills-cache
      if: ${{ inputs.shared-cache == 'true' }}
      uses: actions/cache@v4
      with:
        # The full-text bundle rides in the same per-day cache as bills.jsonl so
        # the clone-skipping cache hit no longer strips full bill text.
        path: |
          bills.jsonl
          shared_bill_text.tar.gz
        key: ${{ steps.cachekey.outputs.key }}

    - name: Install govbot, fetch states, dump bills.jsonl
      if: ${{ steps.bills-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        # The upstream "nightly" release is deleted and recreated daily, so its
        # tag 404s for a short window each day. A bare `curl | bash` fails the
        # whole job when it lands in that window (this is what broke the X
        # poster). Retry with backoff to ride it out.
        installed=0
        for attempt in 1 2 3 4 5; do
          if curl -fsSL https://raw.githubusercontent.com/chihacknight/govbot/main/actions/govbot/scripts/install-nightly.sh | bash; then
            installed=1
            break
          fi
          echo "govbot install attempt ${attempt}/5 failed (nightly release may be mid-republish); retrying..."
          sleep $(( attempt * 10 ))
        done
        if [ "${installed}" -ne 1 ]; then
          echo "::error::govbot install failed after 5 attempts (upstream nightly release unavailable)."
          exit 1
        fi
        export PATH="$HOME/.govbot/bin:$PATH"
        govbot --version || true

        CLONE_TARGET="${{ inputs.clone-target }}"
        if [ "$CLONE_TARGET" = "all" ]; then
          # `clone all` pulls the full supported set (no hardcoded state list to
          # maintain) and `--parallel` runs the git clones concurrently. govbot
          # exits 0 even when individual repos fail, so no per-state skip guard.
          govbot clone all --parallel 8
        else
          # An explicit state list is validated by govbot, which PANICS (exit
          # 101) on a locale it doesn't support — e.g. `govbot clone il tx`
          # aborts the whole clone on "tx" ("Invalid working locale"), losing
          # the supported states too. Clone each state on its own and tolerate
          # failures so one unsupported code just gets skipped (matching how
          # `clone all` silently drops unsupported repos).
          cloned=""
          for st in $CLONE_TARGET; do
            echo "--- Cloning $st ---"
            if govbot clone "$st"; then
              cloned="$cloned $st"
            else
              echo "::warning::govbot could not clone '$st' (unsupported locale or clone error); skipping."
            fi
          done
          echo "Cloned states:${cloned:- (none)}"
        fi

        # POST_LIMIT is tiny and the scripts apply their own freshness + topic
        # filters, so a larger window is just wasted dump + parse time.
        # An optional --filter (e.g. 'none') turns off govbot's built-in
        # relevance filter so the full action log is dumped for the scripts to
        # filter themselves.
        FILTER_ARG=""
        if [ -n "${{ inputs.log-filter }}" ]; then
          FILTER_ARG="--filter ${{ inputs.log-filter }}"
        fi
        SINCE_DAYS="${{ inputs.since-days }}"
        if [ -n "$SINCE_DAYS" ]; then
          # Date-bound the dump. govbot streams the full log to stdout one line
          # per action (it does not buffer the corpus in memory), and the filter
          # keeps only recent records — so 'log-filter: none --limit none' can
          # emit every routine action without ballooning bills.jsonl or letting a
          # per-state cap arbitrarily drop recent actions. Runs before Ollama
          # loads, so the streaming dump has the runner's full RAM.
          CUTOFF_EPOCH=$(date -u -d "${SINCE_DAYS} days ago" +%s)
          TODAY_EPOCH=$(date -u +%s)
          # filter_by_date also probes clone coverage over the full stream and,
          # for any state whose newest action lags the corpus, writes a line to
          # this file so we can raise a GitHub ::warning:: annotation below — its
          # own stdout is bills.jsonl, so it can't emit annotations itself.
          COVERAGE_FLAGS_FILE="$(pwd)/coverage_flags.txt"
          rm -f "$COVERAGE_FLAGS_FILE"
          govbot logs --limit ${{ inputs.log-limit }} $FILTER_ARG \
            | CUTOFF_EPOCH="$CUTOFF_EPOCH" TODAY_EPOCH="$TODAY_EPOCH" \
              COVERAGE_FLAGS_FILE="$COVERAGE_FLAGS_FILE" \
              python3 "$GITHUB_ACTION_PATH/filter_by_date.py" > bills.jsonl
          # Surface stale/missing-state coverage as run annotations (the per-state
          # table is in the step log above). Silent when coverage looks healthy.
          if [ -s "$COVERAGE_FLAGS_FILE" ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::warning title=Stale clone coverage::${line}"
            done < "$COVERAGE_FLAGS_FILE"
          fi
        else
          govbot logs --limit ${{ inputs.log-limit }} $FILTER_ARG > bills.jsonl
        fi
        echo "bills.jsonl is $(wc -l < bills.jsonl) lines"

    - name: Stage full-text bundle from the fresh clone
      # Only when the snapshot is shared (shared-cache) AND this is a cache MISS
      # (the clone just ran, so metadata.json + pre-extracted text are on disk).
      # Copy the small, useful subset into shared_bill_text/ and tar it so it
      # rides in the same per-day cache as bills.jsonl — that's what lets full
      # bill text survive tomorrow's (and later-today's) cache hit, which skips
      # the clone. shared-cache=false callers always re-clone, so full text comes
      # straight from the clone and staging would just be wasted work. Non-fatal:
      # on any failure we still ship an (empty) tarball so the cache path exists
      # and consumers fall back to abstracts.
      if: ${{ inputs.stage-text == 'true' && inputs.shared-cache == 'true' && steps.bills-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        FIRST_TOPIC=""
        for d in topics/*/; do
          [ -f "$d/config.yml" ] && FIRST_TOPIC=$(basename "$d") && break
        done
        if [ -n "$FIRST_TOPIC" ] && \
           BOT_TOPIC="$FIRST_TOPIC" python scripts/stage_bill_text.py shared_bill_text; then
          echo "Staged full-text bundle from the fresh clone."
        else
          echo "::warning::full-text staging failed or no topics; shipping empty bundle (abstracts only)."
          mkdir -p shared_bill_text
        fi
        tar -czf shared_bill_text.tar.gz shared_bill_text
        echo "shared_bill_text.tar.gz is $(du -h shared_bill_text.tar.gz | cut -f1)."

    - name: Reuse cached bills.jsonl + unpack full-text bundle
      # On a cache HIT the clone was skipped, so metadata.json isn't on disk —
      # unpack the staged bundle that rode in the cache and point bill_text at it
      # via GOVBOT_DATA_ROOT (exported to every later step in the job). This is
      # the fix for full text vanishing on same-day re-runs. A v1 cache (or a run
      # with staging off) has no tarball; then GOVBOT_DATA_ROOT stays unset and
      # posts fall back to abstracts, exactly as before.
      if: ${{ steps.bills-cache.outputs.cache-hit == 'true' }}
      shell: bash
      run: |
        echo "Reused today's shared bills.jsonl ($(wc -l < bills.jsonl) lines); skipped the full govbot clone."
        if [ "${{ inputs.stage-text }}" = "true" ] && [ -f shared_bill_text.tar.gz ]; then
          tar -xzf shared_bill_text.tar.gz
          n=$(find shared_bill_text -name metadata.json 2>/dev/null | wc -l)
          echo "GOVBOT_DATA_ROOT=$GITHUB_WORKSPACE/shared_bill_text" >> "$GITHUB_ENV"
          echo "Unpacked full-text bundle: $n bill(s); GOVBOT_DATA_ROOT set for full text without a clone."
        else
          echo "No full-text bundle in this cache; posts will use abstracts only."
        fi
